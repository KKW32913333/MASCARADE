<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MASQUERADE ― 仮面領の一夜</title>
<meta name="description" content="正体を隠したまま王位を競う、一夜限りの仮面舞踏会カードゲーム">
<meta name="theme-color" content="#1a1428">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" href="./favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="icon" href="./favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="./favicon-48x48.png" type="image/png" sizes="48x48">
<link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MASQUERADE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ==== カラーテーマ：Velvet Masquerade（深い紫×金の豪華な配色） ====
     白ベースが簡素に感じられたため、アイコン・スプラッシュ画像の世界観（深い紫・黒・金）に
     寄せた、より舞踏会らしい豪奢な配色に変更。
     他の提案は README.md の「配色プリセット」を参照。 */
  --bg-deep:#1a1428;
  --bg-mid:#2d2147;
  --bg-panel:#241c38;
  --gold:#d4af37;
  --gold-light:#f0d789;
  --gold-dim:#a8842a;
  --velvet:#4a1942;
  --velvet-light:#8b3a6b;
  --sapphire:#2c4a7c;
  --sapphire-light:#5686c9;
  --ivory:#f0ead9;
  --ivory-dim:#c4b8a0;
  --ink:#1a1428;
  --card-face:#f7f0da;
  --card-face-shadow:#ddd0ab;
  --bronze:#a8783c;
  --silver:#9aa3ad;
  --royal:#f0d789;
  --success:#5c9c5c;
  --danger:#c1495f;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0; height:100%;}
body{
  min-height:100dvh;
  background:
    radial-gradient(ellipse 55% 38% at 10% -5%, rgba(212,175,55,0.20), transparent 60%),
    radial-gradient(ellipse 55% 38% at 90% -5%, rgba(44,74,124,0.22), transparent 60%),
    radial-gradient(ellipse 85% 55% at 50% 108%, rgba(139,58,107,0.20), transparent 62%),
    linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 55%, var(--bg-deep) 100%);
  color:var(--ivory);
  font-family:'Zen Maru Gothic', sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body.table-mode{ overflow:hidden; }
.serif{font-family:'Shippori Mincho', serif;}
.display{font-family:'Cormorant Garamond', 'Shippori Mincho', serif;}

/* ---------- ambient sparkle ---------- */
.sparkle-layer{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;}
.sparkle{position:absolute; width:3px; height:3px; border-radius:50%; background:var(--gold); opacity:0; animation:twinkle 6s ease-in-out infinite; box-shadow:0 0 4px rgba(212,175,55,0.6);}
@keyframes twinkle{
  0%{opacity:0; transform:translateY(0) scale(.6);}
  10%{opacity:.85; transform:translateY(-6px) scale(1.2);}
  50%{opacity:.4; transform:translateY(-40px) scale(.9);}
  100%{opacity:0; transform:translateY(-90px) scale(.5);}
}
.candle-glow{position:fixed; pointer-events:none; z-index:0; border-radius:50%; filter:blur(40px); mix-blend-mode:screen;}
.candle-glow.a{ top:-8%; left:6%; width:38vw; height:38vw; background:radial-gradient(circle, rgba(212,175,55,0.28), transparent 65%); animation:flicker 7s ease-in-out infinite; }
.candle-glow.b{ top:-10%; right:4%; width:34vw; height:34vw; background:radial-gradient(circle, rgba(44,74,124,0.26), transparent 65%); animation:flicker 9s ease-in-out infinite reverse; }
.candle-glow.c{ bottom:-14%; left:50%; transform:translateX(-50%); width:70vw; height:40vw; background:radial-gradient(circle, rgba(74,25,66,0.22), transparent 65%); animation:flicker 11s ease-in-out infinite; }
@keyframes flicker{ 0%,100%{opacity:.75; transform:scale(1);} 35%{opacity:1; transform:scale(1.06);} 55%{opacity:.6; transform:scale(.97);} 80%{opacity:.9; transform:scale(1.03);} }

/* ---------- 舞踏会画面（対局中）専用のきらめき装飾 ----------
   ゾーンの背景より手前・モーダルより奥のレイヤーに、金の粒とダイヤ型のグリントを漂わせる。
   操作の邪魔をしないよう pointer-events:none を徹底している。 */
.table-glint-layer{ position:fixed; inset:0; pointer-events:none; z-index:3; overflow:hidden; }
.table-glint-dot{
  position:absolute; width:4px; height:4px; border-radius:50%; background:var(--gold-light);
  opacity:0; box-shadow:0 0 7px rgba(240,215,137,0.85), 0 0 2px rgba(255,255,255,0.9);
  animation:tableGlintTwinkle 5.5s ease-in-out infinite;
}
@keyframes tableGlintTwinkle{
  0%{ opacity:0; transform:translateY(0) scale(.5); }
  12%{ opacity:1; transform:translateY(-8px) scale(1.3); }
  50%{ opacity:.5; transform:translateY(-30px) scale(.9); }
  100%{ opacity:0; transform:translateY(-70px) scale(.4); }
}
.table-glint-star{
  position:absolute; width:14px; height:14px; opacity:0;
  animation:tableGlintStar 4.2s ease-in-out infinite;
}
.table-glint-star::before, .table-glint-star::after{
  content:''; position:absolute; top:50%; left:50%;
  background:linear-gradient(90deg, transparent, var(--gold-light), transparent);
}
.table-glint-star::before{ width:100%; height:1.5px; transform:translate(-50%,-50%); }
.table-glint-star::after{ width:1.5px; height:100%; transform:translate(-50%,-50%); }
@keyframes tableGlintStar{
  0%{ opacity:0; transform:scale(.3) rotate(0deg); }
  15%{ opacity:.95; transform:scale(1.1) rotate(20deg); }
  30%{ opacity:.5; transform:scale(.8) rotate(30deg); }
  55%{ opacity:.8; transform:scale(1) rotate(50deg); }
  100%{ opacity:0; transform:scale(.5) rotate(90deg); }
}
@media (prefers-reduced-motion: reduce){
  .table-glint-dot, .table-glint-star{ animation:none; display:none; }
}

/* =======================================================================
   舞踏会画面（対局中）専用の「輝く金の舞踏会」テーマ
   ・ホーム画面・スプラッシュ画面は従来通りの深い紫（Velvet Masquerade）のまま。
   ・対局中（body.table-mode）だけ、CSS変数を明るい配色に上書きすることで、
     zone・ボタン・文字色などを変更なく丸ごと明るいテーマへ切り替えている。
   ・ヘッダーだけは、明るい舞踏会の上に浮かぶ「濃い額縁」のような帯として、
     従来の暗い配色のまま独立した背景を持たせ、ロゴの視認性を保っている。
   ======================================================================= */
body.table-mode{
  background:
    radial-gradient(ellipse 60% 40% at 15% -5%, rgba(255,235,180,0.9), transparent 60%),
    radial-gradient(ellipse 60% 40% at 85% 0%, rgba(255,214,153,0.7), transparent 62%),
    radial-gradient(ellipse 90% 60% at 50% 110%, rgba(232,180,90,0.35), transparent 65%),
    linear-gradient(180deg, #fffaf0 0%, #fbf0d9 45%, #f6e6c4 100%);
}
body.table-mode header.top{
  background:linear-gradient(180deg, #241a35 0%, #1a1428 100%);
  border-radius:0 0 20px 20px; box-shadow:0 8px 24px rgba(0,0,0,0.35);
  margin:0 -14px; padding-left:14px; padding-right:14px;
}
body.table-mode header.top.compact{ padding-top:8px; }
body.table-mode{
  --bg-deep:#fffaf0;
  --bg-mid:#fdf3dc;
  --bg-panel:#fffdf6;
  --gold:#a9790f;
  --gold-light:#8a5a06;
  --gold-dim:#7a5c1c;
  --velvet:#7a3d6b;
  --velvet-light:#9c5484;
  --sapphire:#2c4a7c;
  --sapphire-light:#4a6da8;
  --ivory:#3d2c14;
  --ivory-dim:#7d6742;
  --ink:#2a1d0a;
  --card-face:#fffdf6;
  --card-face-shadow:#e8d9ae;
  --bronze:#96692c;
  --silver:#8a7a5c;
  --royal:#a9790f;
  --success:#3d7a3d;
  --danger:#a83a4a;
}
/* ヘッダーだけは、上で書き換えたCSS変数の影響を受けないよう、文字色を固定で指定し直す */
body.table-mode .icon-btn{ color:#3d2c14; }
body.table-mode header.top .sfx-toggle,
body.table-mode header.top .bgm-toggle{ color:#f0d789; }
/* zone・action-panel等の枠線・背景を、明るい舞踏会にふさわしい暖かみのある金の縁取りに */
body.table-mode .zone,
body.table-mode #action-zone-wrap{
  background:linear-gradient(160deg, rgba(255,255,255,0.7), rgba(255,246,222,0.55));
  border:1px solid rgba(169,121,15,0.35);
  box-shadow:0 4px 18px rgba(169,121,15,0.12), inset 0 1px 0 rgba(255,255,255,0.8);
}
body.table-mode .zone-label{ background:#fffaf0; }
body.table-mode #action-panel{ background:transparent; }
body.table-mode .card-back{
  background:
    radial-gradient(circle at 50% 42%, rgba(169,121,15,0.35) 0%, transparent 45%),
    repeating-linear-gradient(45deg, #e9cf8f 0 6px, #ddbd6f 6px 12px);
  border-color:#a9790f;
}
/* きらめきの粒も、明るい舞踏会の上で映えるよう、白に近い輝きへ */
body.table-mode .table-glint-dot{ background:#fff6df; box-shadow:0 0 8px rgba(212,160,20,0.9), 0 0 3px rgba(255,255,255,1); }
body.table-mode .table-glint-star::before,
body.table-mode .table-glint-star::after{ background:linear-gradient(90deg, transparent, #c99a1e, transparent); }
body.table-mode .candle-glow{ opacity:.55; mix-blend-mode:multiply; }

@media (prefers-reduced-motion: reduce){
  .sparkle{animation:none; display:none;}
  .candle-glow{animation:none;}
}

/* ---------- splash screen ---------- */
/* 本編が白ベースになった今も、ここだけは意図的に暗いままにしている
   （劇的な幕開け→明るい舞踏会本編、という演出上の効果を狙っている） */
#splash-screen{
  position:fixed; inset:0; z-index:9999;
  height:100dvh; width:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  padding:24px; overflow:hidden; cursor:pointer;
  background-color:#241a35;
  background-image:
    radial-gradient(ellipse 70% 50% at 50% 0%, rgba(240,215,137,0.20), transparent 62%),
    radial-gradient(ellipse 80% 60% at 50% 100%, rgba(139,58,107,0.24), transparent 65%),
    linear-gradient(180deg, #241a35 0%, #3c2c50 55%, #241a35 100%);
  transition:opacity .4s ease, transform .4s ease, visibility .4s ease;
  animation:screenBreathe 6s ease-in-out infinite;
}
#splash-screen.dismissed{ opacity:0; visibility:hidden; pointer-events:none; transform:scale(1.03); }
@keyframes screenBreathe{ 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.05); } }

/* 四隅の金の装飾枠（静的、アニメーションなし＝コストほぼゼロ） */
.splash-corner{ position:absolute; width:15vw; height:15vw; max-width:110px; max-height:110px; min-width:60px; min-height:60px; pointer-events:none; opacity:.55; }
.splash-corner::before{ content:''; position:absolute; inset:0; border-color:#d9ad3f; }
.splash-corner::after{ content:''; position:absolute; width:6px; height:6px; background:#d9ad3f; transform:rotate(45deg); }
.splash-corner.tl{ top:18px; left:18px; }
.splash-corner.tl::before{ border-top:1.5px solid; border-left:1.5px solid; border-radius:14px 0 0 0; }
.splash-corner.tl::after{ top:-3px; left:-3px; }
.splash-corner.tr{ top:18px; right:18px; }
.splash-corner.tr::before{ border-top:1.5px solid; border-right:1.5px solid; border-radius:0 14px 0 0; }
.splash-corner.tr::after{ top:-3px; right:-3px; }
.splash-corner.bl{ bottom:18px; left:18px; }
.splash-corner.bl::before{ border-bottom:1.5px solid; border-left:1.5px solid; border-radius:0 0 0 14px; }
.splash-corner.bl::after{ bottom:-3px; left:-3px; }
.splash-corner.br{ bottom:18px; right:18px; }
.splash-corner.br::before{ border-bottom:1.5px solid; border-right:1.5px solid; border-radius:0 0 14px 0; }
.splash-corner.br::after{ bottom:-3px; right:-3px; }

/* 浮遊する光の粒（JSで5〜6個生成。opacity+transformのみでGPU負荷を抑える） */
.splash-particles{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.splash-particle{ position:absolute; border-radius:50%; background:#f5dd8f; box-shadow:0 0 6px rgba(240,215,137,0.8); animation:splashFloat linear infinite; }
@keyframes splashFloat{
  0%{ opacity:0; transform:translateY(0) scale(.6); }
  10%{ opacity:.9; }
  90%{ opacity:.5; }
  100%{ opacity:0; transform:translateY(-70vh) scale(1.1); }
}

.splash-logo-wrap{ position:relative; display:flex; align-items:center; justify-content:center; z-index:1; }
/* 周回する光点（transform:rotateのみの単一アニメーション、軽量） */
.splash-orbit{ position:absolute; width:min(80vw,340px); height:min(80vw,340px); animation:orbitSpin 14s linear infinite; }
.splash-orbit span{ position:absolute; width:5px; height:5px; border-radius:50%; background:#f5dd8f; box-shadow:0 0 8px rgba(240,215,137,0.9); }
.splash-orbit span:nth-child(1){ top:0; left:50%; margin-left:-2.5px; }
.splash-orbit span:nth-child(2){ bottom:8%; left:8%; }
.splash-orbit span:nth-child(3){ bottom:8%; right:8%; }
@keyframes orbitSpin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce){ .splash-orbit{ animation:none; } }

.splash-title{
  position:relative; z-index:1; margin:0; text-align:center;
  font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:600;
  font-size:clamp(24px,9.5vw,70px); letter-spacing:.02em; white-space:nowrap;
  /* 以前はグラデーション文字（background-clip:text）を使っていたが、
     一部の端末（Android系WebViewやアプリ内ブラウザ等）で正しく描画されず、
     文字が実質見えなくなる不具合が確認されたため、確実に見える単色＋発光表現に変更した。 */
  color:#f0d789;
  text-shadow:0 0 28px rgba(240,215,137,0.65), 0 0 6px rgba(240,215,137,0.5);
}
.splash-title .sl{ display:inline-block; opacity:0; animation:letterRise .6s cubic-bezier(.2,1,.35,1) forwards; }
@keyframes letterRise{ from{ opacity:0; transform:translateY(16px) scale(.9); } to{ opacity:1; transform:translateY(0) scale(1); } }
@media (prefers-reduced-motion: reduce){ .splash-title{ animation:none; } .splash-title .sl{ animation:none; opacity:1; } }

.splash-subtitle{ position:relative; z-index:1; font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif; font-size:clamp(12px,3.2vw,15px); letter-spacing:.22em; color:#cdc3e6; opacity:0; animation:fadeUp .8s ease .9s forwards; }

.splash-divider{ display:flex; align-items:center; gap:10px; opacity:0; animation:fadeUp .8s ease 1.1s forwards; }
.divider-flourish{ width:44px; height:1px; }
.divider-flourish.l{ background:linear-gradient(90deg, transparent, #ab9048); }
.divider-flourish.r{ background:linear-gradient(90deg, #ab9048, transparent); }
.divider-gem{ width:7px; height:7px; background:#d9ad3f; transform:rotate(45deg); box-shadow:0 0 8px rgba(240,215,137,0.7); animation:flicker 3.4s ease-in-out infinite; }

.splash-progress{
  width:min(58vw, 190px); height:4px; border-radius:999px; overflow:hidden;
  background:rgba(255,255,255,0.12); border:1px solid rgba(240,215,137,0.3);
}
.splash-progress-fill{
  height:100%; width:0%; border-radius:999px;
  background:linear-gradient(90deg, #ab9048, #f5dd8f);
  box-shadow:0 0 10px rgba(240,215,137,0.6);
  transition:width 1.6s cubic-bezier(.3,.7,.35,1);
}
.splash-sub{
  font-size:11.5px; letter-spacing:.14em; color:#cdc3e6; font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  min-height:1.4em;
}
.splash-start-btn{
  position:relative; z-index:1; margin-top:6px;
  font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif; font-size:15px; letter-spacing:.2em;
  padding:11px 40px; border-radius:999px; cursor:pointer;
  background:linear-gradient(180deg, #f5dd8f, #d9ad3f 70%); color:#2b2210; border:none;
  box-shadow:0 6px 20px rgba(0,0,0,0.35);
  opacity:0; transform:translateY(8px); pointer-events:none;
  transition:opacity .5s ease, transform .5s ease;
}
.splash-start-btn.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
@media (prefers-reduced-motion: reduce){
  #splash-screen{ animation:none; }
  .splash-particle{ display:none; }
  .splash-start-btn{ transition:opacity .2s ease; }
}

#app{position:relative; z-index:1; max-width:760px; margin:0 auto; padding:0 14px 40px; display:flex; flex-direction:column; min-height:100dvh;}
body.table-mode #app{ height:100dvh; padding-bottom:6px; overflow:hidden; }

/* ---------- header ---------- */
header.top{
  text-align:center; padding:16px 10px 10px; position:relative; flex:0 0 auto;
  transition:padding .25s ease;
}
.sfx-toggle{
  position:absolute; top:12px; right:12px; z-index:2;
  background:rgba(212,175,55,0.08); border:1px solid rgba(212,175,55,0.3); color:var(--ivory);
  width:34px; height:34px; border-radius:50%; font-size:15px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:background .15s ease, opacity .2s ease;
}
.sfx-toggle:hover{ background:rgba(212,175,55,0.18); }
.sfx-toggle.muted{ opacity:.55; }
header.top.compact .sfx-toggle{ top:6px; right:8px; width:26px; height:26px; font-size:12px; }
.bgm-toggle{
  position:absolute; top:12px; right:52px; z-index:2;
  background:rgba(212,175,55,0.08); border:1px solid rgba(212,175,55,0.3); color:var(--ivory);
  width:34px; height:34px; border-radius:50%; font-size:15px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:background .15s ease, opacity .2s ease;
}
.bgm-toggle:hover{ background:rgba(212,175,55,0.18); }
.bgm-toggle.muted{ opacity:.55; }
header.top.compact .bgm-toggle{ top:6px; right:38px; width:26px; height:26px; font-size:12px; }
header.top .eyebrow{
  letter-spacing:.35em; font-size:10px; color:var(--gold); text-transform:uppercase; opacity:0;
  animation:fadeUp .7s ease .05s forwards;
}
header.top h1{
  font-family:'Cormorant Garamond', serif; font-weight:600; font-style:italic;
  font-size:clamp(24px,6.2vw,38px); margin:2px 0 1px; letter-spacing:.03em; white-space:nowrap;
  color:#f0d789;
  text-shadow:0 0 22px rgba(240,215,137,0.5), 0 0 4px rgba(240,215,137,0.4);
  opacity:0; animation:fadeUp .8s ease .18s forwards;
  transition:font-size .25s ease;
}
header.top .subtitle{ font-family:'Shippori Mincho',serif; font-size:clamp(11px,3.4vw,12.5px); letter-spacing:.14em; color:var(--ivory-dim);
  white-space:nowrap; opacity:0; animation:fadeUp .8s ease .32s forwards;
}
header.top .divider{
  width:110px; height:1px; margin:8px auto 0; position:relative; overflow:hidden;
  background:linear-gradient(90deg, transparent, var(--gold), transparent); opacity:0;
  animation:fadeUp .8s ease .46s forwards, shimmerLine 3.4s ease-in-out 1.3s infinite;
}
@keyframes fadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
@keyframes shimmerLine{ 0%,100%{filter:brightness(1);} 50%{filter:brightness(1.9);} }
@media (prefers-reduced-motion: reduce){
  header.top .eyebrow, header.top h1, header.top .subtitle, header.top .divider{ animation:none; opacity:1; }
}

/* 舞踏会画面表示中は「MASQUERADE」のみのコンパクトな見出しにする */
header.top.compact{ padding:8px 10px 4px; }
header.top.compact .eyebrow,
header.top.compact .subtitle,
header.top.compact .divider{ display:none; }
header.top.compact h1{ font-size:20px; margin:0; opacity:1; animation:none; }

/* ---------- start screen ---------- */
#start-screen{ padding:6px 6px 10px; flex:1 1 auto; overflow-y:auto; display:flex; flex-direction:column; justify-content:flex-start; }
.lede{ font-size:13px; line-height:1.65; color:var(--ivory-dim); text-align:center; max-width:420px; margin:6px auto 12px; word-break:normal; overflow-wrap:break-word; text-wrap:pretty; }
.lede b{ color:var(--gold-light); font-weight:700; }

.rules-toggle-wrap{ text-align:center; margin-bottom:8px; }
.tutorial-link-wrap{ text-align:center; margin-top:10px; }
.link-btn{

.btn-grand:active{ transform:translateY(0px) scale(.98); }
@keyframes grandGlow{ 0%,100%{ box-shadow:0 6px 22px rgba(212,175,55,0.35), inset 0 1px 0 rgba(255,255,255,0.5); } 50%{ box-shadow:0 6px 30px rgba(212,175,55,0.6), inset 0 1px 0 rgba(255,255,255,0.6); } }

/* =======================================================================
   カード効果ごとの演出オーバーレイ（effect-stage）
   ・画面全体に一瞬だけ現れる、カードの種類ごとに異なる合図・演出。
   ・クリック等の操作を一切妨げないよう pointer-events:none を貫通させている。
   ・結果を伝えるモーダル（文字表示）はこれまで通りそのまま表示される。演出はその「前振り」。
   ======================================================================= */
.effect-stage{
  position:fixed; inset:0; z-index:60; pointer-events:none;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  opacity:0; visibility:hidden; transition:opacity .25s ease;
}
.effect-stage.open{ opacity:1; visibility:visible; }
.effect-stage-ring{
  position:absolute; width:60px; height:60px; border-radius:50%;
  border:2px solid var(--stage-color, var(--gold));
  box-shadow:0 0 0 0 var(--stage-color, var(--gold));
  opacity:0;
}
.effect-stage.open .effect-stage-ring{ animation:stageRingBurst 1.4s cubic-bezier(.2,.8,.3,1) both; }
@keyframes stageRingBurst{
  0%{ opacity:.9; transform:scale(.3); }
  70%{ opacity:.35; }
  100%{ opacity:0; transform:scale(9); }
}
.effect-stage-particles{ position:absolute; inset:0; overflow:hidden; }
.effect-stage-particle{
  position:absolute; width:4px; height:4px; border-radius:50%;
  background:var(--stage-color, var(--gold)); box-shadow:0 0 6px var(--stage-color, var(--gold));
  opacity:0;
}
.effect-stage.open .effect-stage-particle{ animation:stageParticleFly 1.3s ease-out both; }
@keyframes stageParticleFly{
  0%{ opacity:1; transform:translate(0,0) scale(1); }
  100%{ opacity:0; transform:translate(var(--px,60px),var(--py,-60px)) scale(.3); }
}
.effect-stage-icon{
  position:relative; font-size:64px; line-height:1; filter:drop-shadow(0 0 18px var(--stage-color, var(--gold)));
  opacity:0; transform:scale(.4);
}
.effect-stage.open .effect-stage-icon{ animation:stageIconPop 1.4s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes stageIconPop{
  0%{ opacity:0; transform:scale(.3) rotate(-12deg); }
  55%{ opacity:1; transform:scale(1.15) rotate(4deg); }
  100%{ opacity:0; transform:scale(1) rotate(0deg); }
}
.effect-stage-label{
  position:relative; font-family:'Shippori Mincho',serif; font-size:20px; letter-spacing:.3em;
  color:var(--stage-color, var(--gold-light)); text-shadow:0 0 16px var(--stage-color, var(--gold));
  opacity:0; transform:translateY(8px);
}
.effect-stage.open .effect-stage-label{ animation:stageLabelRise 1.4s cubic-bezier(.2,1,.4,1) .05s both; }
@keyframes stageLabelRise{
  0%{ opacity:0; transform:translateY(14px); }
  40%{ opacity:1; transform:translateY(0); }
  80%{ opacity:1; }
  100%{ opacity:0; transform:translateY(-6px); }
}
@media (prefers-reduced-motion: reduce){
  .effect-stage{ transition:none; }
  .effect-stage .effect-stage-ring, .effect-stage .effect-stage-particle,
  .effect-stage .effect-stage-icon, .effect-stage .effect-stage-label{ animation:none !important; opacity:0 !important; }
}

/* ---- カードごとの個性を出すための追加モーション（アイコンに重ねて適用） ---- */
/* 給仕「看破」：スキャンするような左右の走査線 */
.effect-stage.fx-guessRank .effect-stage-icon{ animation-name:stageIconPop, fxScan; animation-duration:1.4s,1.4s; }
@keyframes fxScan{ 0%,100%{ filter:drop-shadow(0 0 18px var(--stage-color)) brightness(1);} 50%{ filter:drop-shadow(0 0 30px var(--stage-color)) brightness(1.6);} }

/* 楽団員「探知」：波紋が連続で広がるレーダー */
.effect-stage.fx-peekRange .effect-stage-ring{ animation-name:stageRingBurst, fxRadarPulse; }
@keyframes fxRadarPulse{ 0%,100%{ border-width:2px; } 50%{ border-width:4px; } }

/* 預言者「暴露」：仮面が左右に割れて剥がれる */
.effect-stage.fx-revealHand .effect-stage-icon{ animation:fxCrack 1.4s cubic-bezier(.3,.9,.3,1) both; }
@keyframes fxCrack{
  0%{ opacity:0; transform:scale(.5) rotate(0deg); }
  40%{ opacity:1; transform:scale(1.2) rotate(0deg); }
  60%{ transform:scale(1.1) rotate(-6deg); }
  75%{ transform:scale(1.15) rotate(6deg); }
  100%{ opacity:0; transform:scale(1.3) rotate(0deg); }
}

/* 貴婦人「加護」：金の盾がふわりと開く */
.effect-stage.fx-protectSelf .effect-stage-icon{ animation:fxShieldBloom 1.6s cubic-bezier(.2,1.3,.3,1) both; }
@keyframes fxShieldBloom{
  0%{ opacity:0; transform:scale(.2); }
  50%{ opacity:1; transform:scale(1.25); }
  100%{ opacity:0; transform:scale(1.05); }
}
.effect-stage.fx-protectSelf .effect-stage-ring{ animation-name:stageRingBurst, fxShieldRing; }
@keyframes fxShieldRing{ 0%{ border-style:double; border-width:6px; } 100%{ border-style:solid; } }

/* 密偵「隠密」：静かに、影のようにすっと現れて消える */
.effect-stage.fx-peekDeckTop .effect-stage-icon{ animation:fxShadowPeek 1.75s ease both; }
@keyframes fxShadowPeek{
  0%{ opacity:0; transform:translateX(-14px) scale(.7); }
  30%{ opacity:.9; transform:translateX(0) scale(1); }
  70%{ opacity:.9; }
  100%{ opacity:0; transform:translateX(14px) scale(.85); }
}

/* 道化師「悪戯」：2枚が入れ替わるようにくるりと回転 */
.effect-stage.fx-doubleRedraw .effect-stage-icon{ animation:fxJesterSwap 1.6s cubic-bezier(.3,.9,.3,1.1) both; }
@keyframes fxJesterSwap{
  0%{ opacity:0; transform:scale(.5) rotate(0deg); }
  30%{ opacity:1; }
  100%{ opacity:0; transform:scale(1) rotate(340deg); }
}

/* 毒見役「毒杯」：とろりと沈んでいくような、ゆっくりした落下＋滲み */
.effect-stage.fx-secretRedraw .effect-stage-icon{ animation:fxPoisonSink 1.75s ease-in both; }
@keyframes fxPoisonSink{
  0%{ opacity:0; transform:translateY(-10px) scale(.6); }
  35%{ opacity:1; transform:translateY(0) scale(1.1); }
  100%{ opacity:0; transform:translateY(16px) scale(.9); filter:blur(2px) drop-shadow(0 0 18px var(--stage-color)); }
}

/* 黒騎士「決闘」：ぶつかり合うような激しい振動と閃光 */
.effect-stage.fx-compareHand .effect-stage-icon{ animation:fxClash 1.2s cubic-bezier(.2,1,.4,1) both; }
@keyframes fxClash{
  0%{ opacity:0; transform:scale(.6); }
  35%{ opacity:1; transform:scale(1.3); }
  45%{ transform:scale(1.1) translateX(-8px); }
  55%{ transform:scale(1.1) translateX(8px); }
  65%{ transform:scale(1.1) translateX(-4px); }
  100%{ opacity:0; transform:scale(1) translateX(0); }
}

/* 大公「封印」：スタンプを押すように、上からドンと降りてくる */
.effect-stage.fx-sealTurn .effect-stage-icon{ animation:fxSealStamp 1.2s cubic-bezier(.5,0,.3,1.3) both; }
@keyframes fxSealStamp{
  0%{ opacity:0; transform:translateY(-70px) scale(1.4) rotate(-8deg); }
  55%{ opacity:1; transform:translateY(0) scale(1) rotate(0deg); }
  100%{ opacity:0; transform:translateY(0) scale(.96) rotate(0deg); }
}

/* 仮面の主催者「共倒れ」：中心から弾けるように大きく広がる、最も派手な演出 */
.effect-stage.fx-mutualDestroy .effect-stage-icon{ animation:fxShatter 1.9s cubic-bezier(.2,1,.3,1) both; font-size:80px; }
@keyframes fxShatter{
  0%{ opacity:0; transform:scale(.2) rotate(0deg); }
  35%{ opacity:1; transform:scale(1.5) rotate(8deg); }
  50%{ transform:scale(1.3) rotate(-6deg); }
  100%{ opacity:0; transform:scale(2.1) rotate(0deg); }
}
.effect-stage.fx-mutualDestroy .effect-stage-ring{ animation-name:stageRingBurst, fxShatterRing; animation-duration:1.9s,1.9s; }
@keyframes fxShatterRing{ 0%{ border-width:5px; } 100%{ border-width:1px; } }

  <div id="start-screen">
    <p class="lede">
      基本の手札は1枚。自分の番には山札から1枚引いて2枚になり、そのうち1枚を場に出すと、そのカードの効果が発動します。最後まで残った人、または一番大きい数字を持っていた人の勝ちです。
    </p>
    <div class="rules-toggle-wrap">
      <button class="link-btn" id="rules-toggle-btn" onclick="UI.toggleRules()">▾ 仮面の一覧とルールを見る</button>
    </div>
    <div id="rules-panel"></div>

    <div class="difficulty-wrap">
      <div class="difficulty-label">対戦形式</div>
      <div class="difficulty-row" id="mode-row"></div>
      <div class="difficulty-epithet" id="mode-epithet"></div>
    </div>

    <div class="mini-flourish" aria-hidden="true"><span></span></div>

    <div class="difficulty-wrap" id="difficulty-wrap">
      <div class="difficulty-label">対戦相手の格</div>
      <div class="difficulty-row" id="difficulty-row"></div>
      <div class="difficulty-epithet" id="difficulty-epithet"></div>
      <div class="stats-panel" id="stats-panel"></div>
    </div>

    <div class="difficulty-wrap" id="online-wrap" style="display:none;">
      <div class="difficulty-label">オンライン対戦</div>
      <div id="online-panel"></div>
    </div>

    <div class="start-actions" id="start-actions-cpu">
      <button class="btn-grand" onclick="UI.confirmStartGame()">舞踏会をはじめる</button>
    </div>

    <div class="tutorial-link-wrap">
      <button class="link-btn" onclick="Tutorial.start()">▾ はじめての方はこちら（チュートリアル）</button>
    </div>

    <div class="start-deco" id="start-deco" aria-hidden="true"></div>
  </div>

  <!-- ============ TABLE ============ -->
  <div id="table">
    <div class="table-glint-layer" id="table-glint-layer" aria-hidden="true"></div>
    <div class="stale-banner" id="stale-banner" style="display:none;">
      <span>⚠ 対戦相手との接続が途切れているようです</span>
      <button class="btn ghost" style="font-size:11px; padding:5px 10px;" onclick="UI.confirmLeaveStale()">対局を終了する</button>
    </div>
    <div class="status-strip">
      <button class="icon-btn" onclick="UI.backToStart()" title="ホームへ戻る" aria-label="ホームへ戻る">← 戻る</button>
      <div class="turn-badge" id="turn-badge">―</div>
      <div class="status-right">
        <button class="icon-btn" id="quick-chat-btn" onclick="UI.showQuickChatPicker()" title="簡単な質問を送る" aria-label="簡単な質問を送る" style="display:none;">💬</button>
        <button class="icon-btn" onclick="UI.showHelpModal()" title="仮面の説明" aria-label="仮面の説明を見る">？</button>
        <button class="icon-btn" onclick="UI.toggleLog()" title="舞踏会の記録" aria-label="舞踏会の記録を開く">📜</button>
      </div>
    </div>

    <div class="zone" id="opponent-zone">
      <div class="zone-label" id="opp-zone-label">対戦相手</div>
      <div class="player-row">
        <div class="player-name">🎭 <span id="opp-name">仮面卿</span>
          <span class="protect-icon" id="opp-protect">🛡 加護中</span>
          <span class="eliminated-tag" id="opp-eliminated">退場</span>
        </div>
        <div class="deck-count-mini" id="opp-deck-count" title="対戦相手の山札の残り枚数">
          <span class="deck-mini-icon" aria-hidden="true">🂠</span><span id="opp-deck-count-text">0</span>
        </div>
      </div>
      <div class="hand-area" id="opp-hand"></div>
    </div>

    <div class="zone" id="action-zone-wrap">
      <div class="zone-label">場</div>
      <div id="action-panel">
        <div class="prompt" id="ap-prompt">―</div>
      </div>
    </div>

    <div class="zone" id="player-zone">
      <div class="zone-label" id="me-zone-label">あなた</div>
      <div class="player-row">
        <div class="player-name">🕯 <span id="me-name">あなた</span>
          <span class="protect-icon" id="me-protect">🛡 加護中</span>
          <span class="eliminated-tag" id="me-eliminated">退場</span>
        </div>
        <div class="deck-count-mini" id="me-deck-count" title="自分の山札の残り枚数">
          <span class="deck-mini-icon" aria-hidden="true">🂠</span><span id="me-deck-count-text">0</span>
        </div>
      </div>
      <div class="hand-area" id="me-hand"></div>
    </div>

    <button class="fab-discard" id="fab-discard" onclick="UI.showDiscardModal()" title="これまで場に出た仮面を見る" aria-label="これまで場に出た仮面の一覧を見る">🂠</button>
  </div>

  <div id="log-panel"><button class="lg-handle" onclick="UI.toggleLog()" aria-label="閉じる"></button><button class="lg-close-x" onclick="UI.toggleLog()" aria-label="閉じる">×</button></div>

  <footer class="credits">MASQUERADE — an original masquerade deduction card game</footer>
</div>

<!-- 各カード効果ごとの演出オーバーレイ（結果モーダルより下のレイヤーで一瞬光る） -->
<div class="effect-stage" id="effect-stage" aria-hidden="true">
  <div class="effect-stage-ring" aria-hidden="true"></div>
  <div class="effect-stage-particles" id="effect-stage-particles" aria-hidden="true"></div>
  <div class="effect-stage-icon" id="effect-stage-icon"></div>
  <div class="effect-stage-label" id="effect-stage-label"></div>
</div>

<!-- peek / info modal -->
<div class="modal-overlay" id="info-overlay">
  <div class="modal-box" id="info-box"></div>
</div>

<!-- game over modal -->
<div class="modal-overlay" id="gameover-overlay">
  <div class="modal-box" id="gameover-box"></div>
</div>

<!-- help / rules modal -->
<div class="modal-overlay" id="help-overlay">
  <div class="modal-box help-box" id="help-box"></div>
</div>

<!-- discard history modal -->
<div class="modal-overlay" id="discard-overlay">
  <div class="modal-box help-box" id="discard-box"></div>
</div>

<!-- Firebase（オンライン対戦用）。firebase-app / firebase-auth / firebase-firestore の compat 版を使用。
     利用するには、ご自身の Firebase プロジェクトを用意し、下の mask-game.js 内 firebaseConfig に
     ご自身のプロジェクトの設定値を貼り付けてください（詳しくは README.md を参照）。 -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="mask-game.js"></script>
</body>
</html>
